machine:
  name: cutting-gutting
  modbus_port: /dev/serial0
  modbus_baud: 9600
  modbus_parity: N
  modbus_stopbits: 1
  modbus_timeout_s: 0.4
  modbus_poll_s: 1.0
  holding_poll_s: 10.0
  modbus_silence_s: 0.05
  runtime_settings_file: runtime_settings.json

mqtt:
  enabled: true
  host: 18.142.87.81
  port: 1883
  username: "cfpp"
  password: "Cfpp2021"
  client_id: cutting-gutting-rpi
  base_topic: factory/cutting-gutting
  weather_topic: factory/cutting-gutting/weather
  people_topic: factory/cutting-gutting/people_count
  publish_s: 2.0
  keepalive_s: 30
  reconnect_min_s: 2
  reconnect_max_s: 30
  publish_scalar_topics: false
  publish_legacy_json: false
  tls: false

dashboard:
  fullscreen: true
  fps: 3
  productivity_window_s: 60
  screenshot_dir: screenshots
  # Dès que le registre est ajouté au device, le dashboard l'affiche ici.
  # Exemple : ajouter people_count: <adresse> dans input_registers du device.
  people_device: vision_left
  people_key: people_count

# Open-Meteo, sans clé API. Coordonnées par défaut : Taiping, Malaysia.
weather:
  enabled: true
  latitude: 4.8500
  longitude: 100.7400
  update_s: 600
  timeout_s: 8

schedule:
  breaks: ["09:00", "12:00", "15:00", "18:00"] 
  
gpio:
  enabled: true
  disable_waveshare_cip_on_start: true
  # CP-IO22 inputs: BCM4..13, BCM16. Outputs: BCM17..27.
  # Momentary people-count buttons; HIGH means pressed.
  # One count per debounced press, no repeat while held; counters start at zero.
  # No internal pull: the CP-IO22 provides the input conditioning.
  inputs:
    people_left_plus:   {enabled: true, pin: 4, pull_up: null, active_low: false, people_side: left, people_delta: 1, debounce_s: 0.1}
    people_left_minus:  {enabled: true, pin: 5, pull_up: null, active_low: false, people_side: left, people_delta: -1, debounce_s: 0.1}
    system_run_toggle:  {enabled: true, pin: 10, pull_up: null, active_low: false, toggle_group: cleaning, debounce_s: 0.2}
    water_run_toggle:   {enabled: true, pin: 11, pull_up: null, active_low: false, toggle_group: water, debounce_s: 0.2}
    people_right_plus:  {enabled: true, pin: 8, pull_up: null, active_low: false, people_side: right, people_delta: 1, debounce_s: 0.1}
    people_right_minus: {enabled: true, pin: 9, pull_up: null, active_low: false, people_side: right, people_delta: -1, debounce_s: 0.1}
    # Reserved real input pins; keep disabled until motor feedback is wired.
    cutting_motors_on:   {enabled: false, pin: 12, pull_up: null, active_low: false}
    cutting_motors_trip: {enabled: false, pin: 13, pull_up: null, active_low: false}
    # BCM16 remains spare. BCM17/18/19/20 are the CIP outputs.
  # Both groups start OFF; one press starts, the next stops.
  # Active-low outputs compensate the inverted CP-IO22 wiring.
  # LEDs follow the button latch, not the ON/OFF cycle phase.
  toggle_groups:
    cleaning: {channels: [gutting_left, cutting, gutting_right], led_pin: 21, led_active_high: false}
    water: {channels: [water_intake], led_pin: 22, led_active_high: false}
  # CIP durations in SECONDS (s): 2 s ON, 10 s OFF. Decimals allowed.
  # enable permits a channel to run AFTER its group button is pressed.
  cip:
    gutting_left:  {pin: 17, active_high: false, enable: true, on_s: 2, off_s: 10}
    cutting:       {pin: 18, active_high: false, enable: true, on_s: 2, off_s: 10}
    gutting_right: {pin: 19, active_high: false, enable: true, on_s: 2, off_s: 10}
    water_intake:  {pin: 20, active_high: false, enable: true, on_s: 2, off_s: 10}

# Profils de lecture uniquement : aucun slave supplémentaire créé.
# Adresses logiques utilisées directement dans pymodbus, sans soustraire 1.
device_profiles:
  atv320:
    model: ATV320U07N4C
    type: vfd
    telemetry_holding_blocks:
      - {address: 3202, count: 1}
      - {address: 8604, count: 1}
    telemetry_holding_registers:
      frequency_hz: {address: 3202, data_type: int16, scale: 0.1, decimals: 1}
      motor_rpm: {address: 8604, data_type: int16}
    holding_registers: {}
    coils: {}

  frenic_mini_c2:
    model: FRENIC Mini C2
    type: vfd
    # FC03: groupe M = 0x08, M09 = 0x0809 = 2057, uint16 en 0.01 Hz.
    # Fuji: y01=slave, y04=2 (9600), y05=0 (8 bits), y06=3 (8N1), y10=0 (RTU).
    # y06=0 signifie 8N2 et ne correspond PAS au bus actuel.
    telemetry_holding_blocks:
      - {address: 2057, count: 1}
    telemetry_holding_registers:
      frequency_hz: {address: 2057, data_type: uint16, scale: 0.01, decimals: 2}
    holding_registers: {}
    coils: {}

# Toutes les adresses ci-dessous sont des offsets zéro-based pour pymodbus.
# 0 = 30001 pour Input Register, 0 = 40001 pour Holding Register.
devices:
  vfd_infeed:
    profile: atv320
    enabled: true
    label: Belt Infeed
    slave: 8

  vfd_pocket:
    # Remettre simplement "atv320" ici quand le Schneider sera réparé.
    profile: frenic_mini_c2
    enabled: true
    label: Belt Pocket
    slave: 9
    # Effective pockets advanced per MOTOR revolution, including gearbox ratio.
    # null = uncalibrated; dashboards show -- rather than inventing a speed.
    # Formula: pocket/min = abs(motor_rpm) * pockets_per_motor_revolution.
    pockets_per_motor_revolution: null
    # Fuji: pocket/min = frequency_hz * coefficient (pocket/min par Hz).
    # Aucun RPM moteur inventé ; null laisse pocket/min à -- jusqu'à calibration.
    pockets_per_min_per_hz: null

  gutting_left:
    enabled: true
    label: Left gutting
    slave: 3
    type: gutting
    input_blocks:
      - {address: 0, count: 20}
    input_registers:
      rpm_blade: 0
      rpm_wheel1: 1
      rpm_wheel2: 2
      inputs_mask: 3
      outputs_mask: 4
      ejector_state: 5
      ejector_count_lo: 6
      ejector_count_hi: 7
      cip_state: 8
      motors_trip: 9
      motors_on: 10
      belt_on: 11
      belly_on: 12
      alarm_mask: 13
      alarm_unack: 14
      sys_state: 15
      uptime_lo: 16
      uptime_hi: 17
      fw_version: 18
      rpm_belt: 19
    holding_registers:
      eject_delay_ms: {address: 0, min: 0, max: 9999}
      eject_duration_ms: {address: 1, min: 10, max: 5000}
      # CIP limits in SECONDS; *_ms keys name native Modbus registers.
      cip_on_ms: {address: 2, min_s: 0.1, max_s: 60}
      cip_off_ms: {address: 3, min_s: 0.1, max_s: 60}
      ppr_blade: {address: 4, min: 1, max: 999}         # PPR (Pulses Per Revolution) = number of sensor pulses per complete turn.
      ppr_wheel1: {address: 5, min: 1, max: 999}        # Blade PPR applies to the blade; Wheel 1 / Wheel 2 PPR applies to each wheel.
      ppr_wheel2: {address: 6, min: 1, max: 999}        # These settings calibrate the RPM measurement; they do not set motor speed.
      blade_rpm_min: {address: 7, min: 0, max: 9999}    # RPM = pulses per second x 60 / PPR.
      debounce_ms: {address: 8, min: 0, max: 100}       # Example: 2 magnets detected per turn => PPR = 2; 100 pulses/s => 3000 RPM.
    coils:
      eject_enable: {address: 0}
      cip_enable: {address: 1}
      alarm_ack: {address: 2}

  vision_left:
    enabled: true
    label: Left vision
    slave: 5
    type: vision
    input_blocks:
      - {address: 0, count: 3}
    input_registers:
      fish_counter: 0
      gutting_result: 1
      ejected_fish: 2
    holding_registers:
      ml_model: {address: 0, min: 0, max: 20}
    coils:
      eject_enable: {address: 0}

  gutting_right:
    inherit: gutting_left
    label: Right gutting
    slave: 6
    enabled: true

  vision_right:
    inherit: vision_left
    label: Right vision
    slave: 7
    enabled: true

  # Acrel ADL400-D, ADL400 manual table 8: FC03, MSW first.
  # Keep disabled until wired and slave/bus settings are confirmed.
  electricity_meter:
    enabled: false
    label: Acrel ADL400-D
    model: ADL400-D
    meter_profile: acrel_adl400
    slave: 10
    type: utility_meter
    telemetry_holding_blocks:
      - {address: 10, count: 2}    # 0x000A: forward/import active energy
      - {address: 141, count: 2}   # 0x008D PT, 0x008E CT
      - {address: 362, count: 2}   # 0x016A: total active power (32-bit)
    telemetry_holding_registers:
      energy_import_secondary_kwh: {address: 10, data_type: uint32, word_order: big, scale: 0.01}
      pt_ratio: {address: 141}
      ct_ratio: {address: 142}
      power_secondary_kw: {address: 362, data_type: int32, word_order: big, scale: 0.0001}
    holding_registers: {}
    coils: {}

  # DAE U-100B: integrated RS485 Modbus RTU, 9600 baud, 8N1.
  # Native units: US gallons / GPM (U-100BM is the metric variant).
  # Default slave = last two serial-number digits; 11 is only a proposed ID.
  # Register map unavailable: do not use the old placeholder float32 addresses.
  water_meter:
    enabled: false
    label: DAE U-100B
    model: U-100B
    slave: 11
    type: utility_meter
    telemetry_holding_blocks: []
    telemetry_holding_registers: {}
    # Apply after the raw register units/scaling have been confirmed:
    # 1 US gal = 0.003785411784 m3; 1 GPM = 3.785411784 L/min.
    holding_registers: {}
    coils: {}
