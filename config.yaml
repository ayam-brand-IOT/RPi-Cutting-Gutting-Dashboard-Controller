machine:
  name: cutting-gutting
  modbus_port: /dev/serial0
  modbus_baud: 9600
  modbus_parity: N
  modbus_stopbits: 1
  modbus_timeout_s: 0.4
  modbus_poll_s: 1.0
  holding_poll_s: 10.0
  modbus_silence_s: 0.05
  runtime_settings_file: runtime_settings.json

mqtt:
  enabled: true
  host: 192.168.100.51
  port: 1883
  username: "cfpp"
  password: "Cfpp2021"
  client_id: cutting-gutting-rpi
  base_topic: factory/cutting-gutting
  weather_topic: factory/cutting-gutting/weather
  people_topic: factory/cutting-gutting/people_count
  publish_s: 2.0
  keepalive_s: 30
  reconnect_min_s: 2
  reconnect_max_s: 30
  publish_scalar_topics: false
  publish_legacy_json: false
  tls: false

dashboard:
  fullscreen: true
  fps: 3
  productivity_window_s: 60
  screenshot_dir: screenshots
  # Dès que le registre est ajouté au device, le dashboard l'affiche ici.
  # Exemple : ajouter people_count: <adresse> dans input_registers du device.
  people_device: vision_left
  people_key: people_count

# Open-Meteo, sans clé API. Coordonnées par défaut : Taiping, Malaysia.
weather:
  enabled: true
  latitude: 4.8500
  longitude: 100.7400
  update_s: 600
  timeout_s: 8

schedule:
  breaks: ["09:00", "12:00", "15:00", "18:00"] 
  
gpio:
  enabled: true
  disable_waveshare_cip_on_start: true
  # CP-IO22 inputs: BCM4..13, BCM16. Outputs: BCM17..27.
  # Presence: one maintained sensor per workstation; HIGH means occupied.
  # Set active_low: true if the actual sensor/board signal is inverted.
  # No internal pull: the CP-IO22 provides the input conditioning.
  inputs:
    people_left_1:  {enabled: true, pin: 4,  pull_up: null, active_low: false, presence_side: left, debounce_s: 0.1}
    people_left_2:  {enabled: true, pin: 5,  pull_up: null, active_low: false, presence_side: left, debounce_s: 0.1}
    people_left_3:  {enabled: true, pin: 6,  pull_up: null, active_low: false, presence_side: left, debounce_s: 0.1}
    people_left_4:  {enabled: true, pin: 7,  pull_up: null, active_low: false, presence_side: left, debounce_s: 0.1}
    people_right_1: {enabled: true, pin: 8,  pull_up: null, active_low: false, presence_side: right, debounce_s: 0.1}
    people_right_2: {enabled: true, pin: 9,  pull_up: null, active_low: false, presence_side: right, debounce_s: 0.1}
    people_right_3: {enabled: true, pin: 10, pull_up: null, active_low: false, presence_side: right, debounce_s: 0.1}
    people_right_4: {enabled: true, pin: 11, pull_up: null, active_low: false, presence_side: right, debounce_s: 0.1}
    # Reserved real input pins; keep disabled until motor feedback is wired.
    cutting_motors_on:   {enabled: false, pin: 12, pull_up: null, active_low: false}
    cutting_motors_trip: {enabled: false, pin: 13, pull_up: null, active_low: false}
    # BCM16 remains spare. BCM17/18/19 remain the CIP outputs.
  # CIP durations in SECONDS (s): 2 s ON, 10 s OFF. Decimals allowed.
  cip:
    gutting_left:  {pin: 17, active_high: true, enable: true, on_s: 2, off_s: 10}
    cutting:       {pin: 18, active_high: true, enable: true, on_s: 2, off_s: 10}
    gutting_right: {pin: 19, active_high: true, enable: true, on_s: 2, off_s: 10}

# Toutes les adresses ci-dessous sont des offsets zéro-based pour pymodbus.
# 0 = 30001 pour Input Register, 0 = 40001 pour Holding Register.
devices:
  gutting_left:
    enabled: true
    label: Left gutting
    slave: 3
    type: gutting
    input_blocks:
      - {address: 0, count: 20}
    input_registers:
      rpm_blade: 0
      rpm_wheel1: 1
      rpm_wheel2: 2
      inputs_mask: 3
      outputs_mask: 4
      ejector_state: 5
      ejector_count_lo: 6
      ejector_count_hi: 7
      cip_state: 8
      motors_trip: 9
      motors_on: 10
      belt_on: 11
      belly_on: 12
      alarm_mask: 13
      alarm_unack: 14
      sys_state: 15
      uptime_lo: 16
      uptime_hi: 17
      fw_version: 18
      rpm_belt: 19
    holding_registers:
      eject_delay_ms: {address: 0, min: 0, max: 9999}
      eject_duration_ms: {address: 1, min: 10, max: 5000}
      # CIP limits in SECONDS; *_ms keys name native Modbus registers.
      cip_on_ms: {address: 2, min_s: 0.1, max_s: 60}
      cip_off_ms: {address: 3, min_s: 0.1, max_s: 60}
      ppr_blade: {address: 4, min: 1, max: 999}         # PPR (Pulses Per Revolution) = number of sensor pulses per complete turn.
      ppr_wheel1: {address: 5, min: 1, max: 999}        # Blade PPR applies to the blade; Wheel 1 / Wheel 2 PPR applies to each wheel.
      ppr_wheel2: {address: 6, min: 1, max: 999}        # These settings calibrate the RPM measurement; they do not set motor speed.
      blade_rpm_min: {address: 7, min: 0, max: 9999}    # RPM = pulses per second x 60 / PPR.
      debounce_ms: {address: 8, min: 0, max: 100}       # Example: 2 magnets detected per turn => PPR = 2; 100 pulses/s => 3000 RPM.
      coils:                                            # Firmware default: 1. Match the actual number of pulses per turn.
      eject_enable: {address: 0}
      cip_enable: {address: 1}
      alarm_ack: {address: 2}

  vision_left:
    enabled: true
    label: Left vision
    slave: 5
    type: vision
    input_blocks:
      - {address: 0, count: 3}
    input_registers:
      fish_counter: 0
      gutting_result: 1
      ejected_fish: 2
    holding_registers:
      ml_model: {address: 0, min: 0, max: 20}
    coils:
      eject_enable: {address: 0}

  gutting_right:
    inherit: gutting_left
    label: Right gutting
    slave: 6
    enabled: true

  vision_right:
    inherit: vision_left
    label: Right vision
    slave: 7
    enabled: true

  # ADRESSES PROVISOIRES : remplacer selon la notice du compteur réel.
  # Ce device reste désactivé pour éviter des timeouts tant qu'il n'est pas câblé.
  electricity_meter:
    enabled: false
    label: Electricity meter
    slave: 10
    type: utility_meter
    input_blocks:
      - {address: 0, count: 6}
    input_registers:
      power_kw:          {address: 0, data_type: float32, word_order: big, decimals: 2}
      energy_today_kwh:  {address: 2, data_type: float32, word_order: big, decimals: 2}
      energy_month_kwh:  {address: 4, data_type: float32, word_order: big, decimals: 2}
    holding_registers: {}
    coils: {}

  # ADRESSES PROVISOIRES : remplacer selon la notice du compteur réel.
  water_meter:
    enabled: false
    label: Water meter
    slave: 11
    type: utility_meter
    input_blocks:
      - {address: 0, count: 6}
    input_registers:
      flow_l_min:       {address: 0, data_type: float32, word_order: big, decimals: 2}
      water_today_m3:   {address: 2, data_type: float32, word_order: big, decimals: 3}
      water_month_m3:   {address: 4, data_type: float32, word_order: big, decimals: 3}
    holding_registers: {}
    coils: {}
